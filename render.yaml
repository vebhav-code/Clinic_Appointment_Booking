services:
  - type: web
    name: pulse-clinic-backend
    env: python
    region: oregon
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: clinic_t84p
          property: connectionString
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      - key: CANCEL_CUTOFF_HOURS
        value: "2"
      - key: BOOKING_WINDOW_DAYS
        value: "60"
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://pulseclinic.vercel.app,http://localhost:5173
      - key: EMAIL_REMINDERS_ENABLED
        value: "false"

databases:
  - name: clinic_t84p
    databaseName: clinic_t84p
    user: clinic_t84p_user
    region: oregon
    plan: free
